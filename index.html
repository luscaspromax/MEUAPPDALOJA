<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valiosa Imports PRO</title>
    <style>
        :root { 
            --primary: #e91e63; 
            --bg: #ffeef5; 
            --success: #2ecc71; 
            --danger: #ff4757; 
            --dark: #2f3542; 
        }
        
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 15px; color: var(--dark); margin: 0; }
        
        .container { background: #fff; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* PAINEL DE CONTROLO */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card-dash { background: #fff; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--primary); }
        .card-dash small { color: #747d8c; font-size: 11px; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 5px; }
        .card-dash span { font-size: 17px; font-weight: bold; color: var(--primary); }

        input, select { padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; font-size: 16px; }
        
        button { padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: 0.2s; }
        button:active { transform: scale(0.98); }

        .flex-group { display: flex; gap: 10px; }
        
        /* CALCULADORA */
        .card-calc { background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0; border-left: 5px solid var(--primary); font-size: 14px; line-height: 1.5; }

        /* ESTOQUE */
        .produto-item { background: #fafafa; padding: 15px; margin-top: 12px; border-radius: 12px; border: 1px solid #eee; }
        .produto-info { margin-bottom: 12px; }
        .acoes-estoque { display: flex; gap: 8px; }
        .btn-vender { background: var(--success); flex: 3; }
        .btn-excluir { background: #ced4da; color: #444; flex: 1; }

        /* RECIBO */
        #comprovanteBox { 
            background: #fff; border: 1px dashed #ccc; padding: 20px; border-radius: 5px; 
            white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; 
            font-size: 14px; color: #000; margin-top: 10px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="loginSection" class="container" style="max-width: 320px; margin: 60px auto; text-align: center;">
    <h1 style="color: var(--primary);">💖</h1>
    <h3>Acesso Valiosa</h3>
    <input type="password" id="senhaInput" placeholder="Senha">
    <button onclick="entrar()">Entrar</button>
</div>

<div id="app" class="hidden">
    <h2 style="text-align: center; color: var(--primary);">Valiosa Imports 💕</h2>

    <div class="dashboard">
        <div class="card-dash"><small>🛍️ No Estoque</small><span id="dashEstoque">0</span></div>
        <div class="card-dash"><small>👤 Vendas</small><span id="dashVendas">0</span></div>
        <div class="card-dash"><small>💸 Investido</small><span id="dashCusto">R$ 0</span></div>
        <div class="card-dash" style="border-color: var(--success);"><small>📈 Lucro Real</small><span id="dashLucro">R$ 0</span></div>
    </div>

    <div class="container">
        <h3>📦 Cadastrar Produto</h3>
        <input id="nome" placeholder="Nome do Produto">
        <div class="flex-group">
            <input id="custo" type="number" placeholder="Custo R$" oninput="calcularInteligente()">
            <input id="extra" type="number" placeholder="Mimos/Extras R$" oninput="calcularInteligente()">
        </div>
        <div class="card-calc" id="resultadoCalc">Insira os valores para análise...</div>
        <input id="precoVenda" type="number" placeholder="Preço de Venda R$" oninput="calcularInteligente()">
        <input id="quantidade" type="number" placeholder="Qtd Inicial">
        <button onclick="adicionarProduto()">Salvar Produto</button>
    </div>

    <div class="container">
        <h3>👤 Dados da Cliente</h3>
        <input id="clienteNome" placeholder="Nome Completo">
        <input id="clienteWhats" type="tel" placeholder="WhatsApp (Com DDD)">
        <input id="clienteEndereco" placeholder="Endereço">
        <select id="pagamento">
            <option value="">Forma de Pagamento</option>
            <option>Pix</option>
            <option>Dinheiro</option>
            <option>Cartão</option>
        </select>
    </div>

    <div class="container">
        <h3>🏬 Gestão de Estoque</h3>
        <div id="listaEstoque"></div>
    </div>

    <div class="container">
        <h3>🧾 Último Recibo</h3>
        <div id="comprovanteBox">Aguardando venda...</div>
        <div class="flex-group" style="margin-top:15px;">
            <button onclick="copiarRecibo()" style="background: #555;">📋 Copiar</button>
            <button onclick="enviarWhatsApp()" style="background: #25d366;">📲 WhatsApp</button>
        </div>
    </div>
</div>

<script>
const SENHA_MESTRA = "1234";
let produtos = JSON.parse(localStorage.getItem("valiosa_prod_v7")) || [];
let historicoFinanceiro = JSON.parse(localStorage.getItem("valiosa_fin_v7")) || { lucro: 0, custo: 0, vendas: 0 };
let ultimoRecibo = "";
let whatsAtual = "";

function entrar() {
    if(document.getElementById("senhaInput").value === SENHA_MESTRA) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        render();
    } else alert("Senha incorreta!");
}

function calcularInteligente() {
    const c = +document.getElementById("custo").value || 0;
    const e = +document.getElementById("extra").value || 0;
    const v = +document.getElementById("precoVenda").value || 0;
    const totalCusto = c + e;
    const lucro = v - totalCusto;
    const calc = document.getElementById("resultadoCalc");

    if(totalCusto > 0) {
        calc.innerHTML = `💰 Lucro por peça: <b>R$ ${lucro.toFixed(2)}</b><br>` +
                         `💡 Sugestão (60% margem): <b>R$ ${(totalCusto * 1.6).toFixed(2)}</b>`;
    }
}

function adicionarProduto() {
    const nome = document.getElementById("nome").value;
    const custo = +document.getElementById("custo").value || 0;
    const extra = +document.getElementById("extra").value || 0;
    const preco = +document.getElementById("precoVenda").value || 0;
    const qtd = +document.getElementById("quantidade").value || 0;

    if(!nome || preco <= 0) return alert("Preencha o nome e preço!");

    produtos.push({ nome, preco, quantidade: qtd, custoIndividual: (custo + extra) });
    salvar();
    ["nome", "custo", "extra", "precoVenda", "quantidade"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("resultadoCalc").innerText = "Produto Adicionado!";
}

function vender(index) {
    const p = produtos[index];
    const nomeCli = document.getElementById("clienteNome").value;
    const whats = document.getElementById("clienteWhats").value;
    const end = document.getElementById("clienteEndereco").value;
    const pgto = document.getElementById("pagamento").value;

    if(!nomeCli || !pgto) return alert("Preencha os dados da cliente!");
    if(p.quantidade <= 0) return alert("Estoque esgotado!");

    p.quantidade--;
    historicoFinanceiro.vendas++;
    historicoFinanceiro.lucro += (p.preco - p.custoIndividual);
    historicoFinanceiro.custo += p.custoIndividual;

    whatsAtual = whats;
    const agora = new Date().toLocaleString('pt-BR');

    ultimoRecibo = `Valiosa imports 💕
--------------------------
     RECIBO DE VENDA      
--------------------------

Nome: ${nomeCli}
Endereço: ${end}
Produto: ${p.nome}
Total: R$ ${p.preco.toFixed(2)}
Pagamento: ${pgto}
Data e horário: ${agora}

--------------------------
Obrigada pela compra,
seu pedido já está a caminho! 😍✨`;

    document.getElementById("comprovanteBox").innerText = ultimoRecibo;
    salvar();
}

function excluirProduto(index) {
    if(confirm("Tem certeza que deseja remover este produto definitivamente?")) {
        produtos.splice(index, 1);
        salvar();
    }
}

function salvar() {
    localStorage.setItem("valiosa_prod_v7", JSON.stringify(produtos));
    localStorage.setItem("valiosa_fin_v7", JSON.stringify(historicoFinanceiro));
    render();
}

function render() {
    // Atualizar Painel
    let totalEstoque = 0;
    produtos.forEach(p => totalEstoque += p.quantidade);
    document.getElementById("dashEstoque").innerText = totalEstoque;
    document.getElementById("dashVendas").innerText = historicoFinanceiro.vendas;
    document.getElementById("dashCusto").innerText = "R$ " + historicoFinanceiro.custo.toFixed(2);
    document.getElementById("dashLucro").innerText = "R$ " + historicoFinanceiro.lucro.toFixed(2);

    // Atualizar Lista
    const lista = document.getElementById("listaEstoque");
    lista.innerHTML = "";
    produtos.forEach((p, i) => {
        lista.innerHTML += `
            <div class="produto-item">
                <div class="produto-info">
                    <b>${p.nome}</b><br>
                    <small>Qtd: ${p.quantidade} | Preço: R$ ${p.preco.toFixed(2)}</small>
                </div>
                <div class="acoes-estoque">
                    <button class="btn-vender" onclick="vender(${i})">Vender</button>
                    <button class="btn-excluir" onclick="excluirProduto(${i})">Excluir</button>
                </div>
            </div>`;
    });
}

function copiarRecibo() {
    if(ultimoRecibo === "") return alert("Gere uma venda primeiro!");
    navigator.clipboard.writeText(ultimoRecibo);
    alert("Copiado com sucesso! 💕");
}

function enviarWhatsApp() {
    if(ultimoRecibo === "") return alert("Gere uma venda primeiro!");
    if(!whatsAtual) return alert("WhatsApp da cliente em falta!");
    const link = `https://wa.me/${whatsAtual.replace(/\D/g, '')}?text=${encodeURIComponent(ultimoRecibo)}`;
    window.open(link, '_blank');
}
</script>
</body>
</html>
